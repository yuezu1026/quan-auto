[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "quan-auto"
# ⚠️ 这个版本号与 quanauto/__init__.py 的 __version__ 必须一致 ——
#    tests/test_skeleton.py 会核对两处，改一处不改另一处会红（两个版本来源 = 已知漂移源）。
version = "0.1.0"
description = "智能量化交易平台 —— Python 研究/回测线（I1 已打通 CSV→双均线→撮合→绩效→报告 的最窄竖切）"
requires-python = ">=3.11"

# 依赖**必须**是实现推着走：I1 的竖切只用标准库；I2 起按需加入，
# 并且每加一条都要说明是哪一个模块在用它。禁止预先堆一份「以后可能要用」的清单。
dependencies = [
    # 使用者：quanauto/datasources.py。
    # 数据中心契约 §3.2 逐字规定 `fetch_daily_bar(...) -> pd.DataFrame`、
    # `validate(self, frame: pd.DataFrame)` —— 归一化与校验都长在 DataFrame 上，
    # 所以它是硬依赖，不是「以后可能要用」的占位。
    "pandas>=2.0",
]

[project.optional-dependencies]
dev = ["pytest>=8"]
# 使用者：quanauto/datasources.py 的 AKShareAdapter / BaostockAdapter。
# 两者都只取日线/财报/成分股，属「取数出口」而非计算内核 —— 放进 extra 是为了让
# 默认安装与 CI 不必拖进 akshare 的 16 条依赖；适配器对它们是**惰性 import**，
# 缺失时报 SourceAdapterError（DATA_005），而不是让裸 ImportError 逃出去。
datasources = ["akshare>=1.18", "baostock>=0.9.4"]
# 使用者：quanauto/pgstore.py 的 PsycopgConnection —— 落库侧的驱动，在
# `_import_psycopg()` 里**惰性 import**，缺失时报 InvalidConfigError，不让裸
# ImportError 逃出去。放 extra 而不是 dependencies 的理由与 [datasources] 相同：
# 默认安装与 CI 不必拖进数据库驱动。要真跑落库侧的真库路径就
# `pip install -e ".[postgres]"`（本机 `.venv` 里已有 psycopg 3.3.6 + psycopg-binary 3.3.6）。
# ⚠️ 这里的版本下限与 pgstore.py 报错文案里教用户装的 `psycopg>=3.1` **必须一致**；
# 两处只有下限要求相同（这里多写 `[binary]` 是为了开发机不必自带 libpq，给用户的
# 消息保持最朴素的写法）。**这条一致性由 `skeleton` 门禁的 `DRIVER-EXTRA` 探测器守**
# （2026-09-25 补：任一处漂开即 FAIL；源码里提取不到提示也 FAIL，不许把「没提到」
# 当成「一致」）。`[datasources]` 那一对至今仍靠人工 —— 要同样加牙就把它加进
# `tools/verify_skeleton.py` 的 `DRIVER_EXTRA` 清单。
postgres = ["psycopg[binary]>=3.1"]

[tool.setuptools]
packages = ["quanauto"]

[tool.pytest.ini_options]
testpaths = ["tests"]
# 仓库是扁平布局、包未安装，靠这条把仓库根挂进 sys.path。
pythonpath = ["."]
addopts = ["-ra", "--strict-markers", "--strict-config"]
