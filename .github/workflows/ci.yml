# CI：与本地**同一套命令**，两件事 —— 跑测试、跑门禁。
#
# 为什么只有这两步：本仓库的判据都在 `tools/run_all_gates.py` 里，测试是 TDD 的红网。
# 任何「CI 里额外做一遍、本地不做」的检查都会变成两套口径，所以不设。
#
# 两个自带的反空转出口码（不要用 `|| true` 把它们吞掉）：
#   pytest        收集到 0 个测试 -> 退出码 5（非 0）
#   run_all_gates 全部门禁 PASS 时退出码 0；门禁失败 = 1；**harness 自身自测失败 = 2**
#
# ⚠️ 2026-09-24 起这份 workflow **真的在 GitHub 上跑**（remote `origin`，公开仓库）。
#    首次真跑就在 `skeleton` 门禁上判红：本机有 `.venv/`、克隆里没有，同一个 commit
#    两边结论不同 ⇒ 判据依赖环境，已修（`verify_skeleton._classify_ref`）。
#    修复后重推，第二次运行 success（2026-09-24，run 35939823649）—— 这才是「跑通」。
#    结论一律以某次运行的输出为准，别拿本注释当证据；
#    本机口径的等价证据仍是 `python tools/ci_dryrun.py`（`tools/ci-dryrun-report.txt`）。

name: ci

on:
  push:
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      # 用 -e .[dev] 而不是单独装 pytest：这样 pyproject.toml 的
      # [build-system] 与 [project] 也会被真实走一遍（打包配置写错会在这里红）。
      - name: Install
        run: python -m pip install -e ".[dev]"

      - name: pytest
        run: python -m pytest -q

      - name: gates
        run: python tools/run_all_gates.py
